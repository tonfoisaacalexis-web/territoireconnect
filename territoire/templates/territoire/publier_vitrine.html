<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace de Publication Annuelle — Mairie de {{ mairie.nom }}</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #f1f5f9; padding: 4px; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { background: white; padding: 40px; border-radius: 12px; max-width: 600px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 8px solid #059669; }
        .group { margin-bottom: 20px; }
        .group label { display: block; font-size: 13px; font-weight: bold; color: #334155; margin-bottom: 6px; text-transform: uppercase; }
        .group input, .group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn { background: #059669; color: white; border: none; padding: 15px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #059669; margin-top: 0; font-size: 20px; font-weight: 800;">🏛️ Mairie de {{ mairie.nom }} — Bureau des Publications</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Saisissez vos rapports et chantiers de développement pour les déployer en direct sur le portail public.</p>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="group"><label>Nom complet de Monsieur le Maire</label><input type="text" name="nom_du_maire" value="{{ mairie.nom_du_maire|default:'' }}"></div>
            <div class="group"><label>Photo officielle de l'Exécutif</label><input type="file" name="photo_du_maire" accept="image/*"></div>
            <div class="group"><label>Mot d'orientation générale</label><textarea name="mot_du_maire" rows="3">{{ mairie.mot_du_maire|default:'' }}</textarea></div>
            <div class="group"><label>Histoire & Fondations du Territoire</label><textarea name="histoire" rows="3">{{ mairie.histoire|default:'' }}</textarea></div>
            <div class="group"><label>Géographie, Limites et Climat</label><textarea name="geographie" rows="2">{{ mairie.geographie|default:'' }}</textarea></div>
            <div class="group"><label>Vision stratégique de développement</label><textarea name="vision_mairie" rows="3">{{ mairie.vision_mairie|default:'' }}</textarea></div>
            <div class="group"><label>Chantiers prioritaires à Court Terme</label><textarea name="projets_court_terme" rows="2">{{ mairie.projets_court_terme|default:'' }}</textarea></div>
            <div class="group"><label>Grands Projets à Long Terme</label><textarea name="projets_long_terme" rows="2">{{ mairie.projets_long_terme|default:'' }}</textarea></div>
            <button type="submit" class="btn">🚀 Enregistrer et Publier la Vitrine</button>
        </form>
    </div>
</body>
</html>
