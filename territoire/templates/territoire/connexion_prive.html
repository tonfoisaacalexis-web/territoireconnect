<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès Sécurisé | Mairie de {{ mairie.nom }}</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center px-4 font-sans">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-200">
        <div class="text-center mb-6">
            <span class="text-4xl">🔒</span>
            <h1 class="text-2xl font-bold text-gray-800 mt-3">Espace de Publication Privé</h1>
            <p class="text-sm text-gray-500 mt-1">Mairie de {{ mairie.nom }}</p>
        </div>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="p-3 text-sm rounded-lg bg-red-100 text-red-800">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-6">
                <label for="code_secret" class="block text-sm font-medium text-gray-700 mb-2">Entrez votre code secret communal :</label>
                <input type="password" id="code_secret" name="code_secret" required placeholder="••••••••" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none text-center font-mono text-xl tracking-widest">
            </div>

            <button type="submit" name="soumettre_code_secret" 
                    class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-3 px-4 rounded-xl transition-colors shadow-md">
                Valider l'authentification
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'accueil_portail' %}" class="text-xs text-gray-400 hover:text-gray-600 underline">
                ← Retour au Portail National
            </a>
        </div>
    </div>

</body>
</html>
